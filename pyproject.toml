[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fallgorithm"
version = "0.1.0"
description = "Small, reproducible frame-input experiments with Block Stack"
requires-python = ">=3.10"
dependencies = ["block-stack>=0.1.0"]

[project.optional-dependencies]
# Experiment 020's value network (training, and its data files).
value = ["numpy>=2.0", "torch==2.14.0"]

[project.scripts]
block-stack-ai = "block_stack_ai.cli:main"
fallgorithm = "block_stack_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires the built sibling native engine and installed Python binding",
    "desktop: also requires the built SDL3 desktop client (uses dummy video/audio)",
    "native: requires fallgorithm's C++ library (scripts/build_native.py)",
]
