name: Unit tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The retained-record checks resolve the publication and base snapshots'
          # commit/tree pairings from this repository's own objects, so a checkout
          # carrying only the tip cannot make the claim they check.
          fetch-depth: 0
      - name: Fetch pull-request refs for retained producer commits
        # A squash-merged experiment branch can leave the producer commit a
        # retention manifest names reachable only through that experiment's
        # pull-request ref, which a default checkout does not fetch. Fetching the
        # refs keeps the record checks comparing against the measured commit
        # rather than against a softened substitute.
        run: git fetch --no-tags origin '+refs/pull/*/head:refs/remotes/origin/pr/*'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check out the Block Stack engine beside the project
        # Many checks outside the integration marker play games on the engine or
        # on fallgorithm's C++ library, so the runner needs both built. The
        # commit is the one the current experiments were measured on; raise it
        # when the local ../block-stack moves.
        run: |
          git clone --quiet https://github.com/HarmonChew/block-stack.git ../block-stack
          git -C ../block-stack checkout --quiet --detach 4d467820deb842bad3a1310b24fcfe9947f80292
          # Experiments 004 and 005 fingerprint the older engine source, so their
          # retained-evidence checks (tests/test_unit.py) are run against it.
          git clone --quiet https://github.com/HarmonChew/block-stack.git ../block-stack-legacy-8ca4158
          git -C ../block-stack-legacy-8ca4158 checkout --quiet --detach 8ca4158711c2d6339cab1ee8d78aa65bd624c89d
      - name: Build the engine, its binding and the native library
        # The README's setup, with the `value` extra's numpy and torch (imported
        # at module level from Experiment 020 on). The CPU wheel is enough here.
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install pytest==9.1.1 "numpy>=2.0" torch==2.14.0 \
            --extra-index-url https://download.pytorch.org/whl/cpu
          .venv/bin/python scripts/setup_engine.py
          .venv/bin/python scripts/build_native.py
      - name: Unit checks on the current engine
        run: >-
          PYTHONPATH=src .venv/bin/python -m pytest -q -p no:cacheprovider
          -m "not integration" --ignore=tests/test_unit.py
      - name: Retained-evidence checks on the older engine source
        run: >-
          BLOCK_STACK_ROOT=../block-stack-legacy-8ca4158 PYTHONPATH=src
          .venv/bin/python -m pytest -q -p no:cacheprovider
          -m "not integration" tests/test_unit.py
